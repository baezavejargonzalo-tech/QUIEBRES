<title>__TITULO__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: hoja de planificación — encabezado compacto, KPIs, curva semanal, luego tablas de trabajo a todo el ancho */
:root{
  --bg:#f5f7f9; --panel:#ffffff; --ink:#14212e; --muted:#5b6875; --line:#dbe2e8; --soft:#eef2f5;
  --accent:#1d5c8f; --accent-soft:#d9e7f2; --y25:#9aa7b3;
  --merma:#a86400; --merma-bg:#fbefdc; --quiebre:#b3261e; --quiebre-bg:#fae3e1; --ok:#2d7a4a; --ok-bg:#e1f1e6;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f161d; --panel:#16202a; --ink:#e4ebf1; --muted:#97a5b2; --line:#2a3743; --soft:#1c2834;
  --accent:#6fb0e3; --accent-soft:#1d3447; --y25:#5f6e7b;
  --merma:#e9a94b; --merma-bg:#3a2a12; --quiebre:#f08a80; --quiebre-bg:#3d1c1a; --ok:#6cc48d; --ok-bg:#16301f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161d; --panel:#16202a; --ink:#e4ebf1; --muted:#97a5b2; --line:#2a3743; --soft:#1c2834;
  --accent:#6fb0e3; --accent-soft:#1d3447; --y25:#5f6e7b;
  --merma:#e9a94b; --merma-bg:#3a2a12; --quiebre:#f08a80; --quiebre-bg:#3d1c1a; --ok:#6cc48d; --ok-bg:#16301f; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:1360px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:28px}
h1,h2,h3{font-family:var(--f-display);font-stretch:85%;margin:0;text-wrap:balance}
h1{font-size:clamp(28px,4vw,40px);font-weight:800;letter-spacing:-.01em}
h2{font-size:20px;font-weight:700}
.eyebrow{font-family:var(--f-display);font-stretch:80%;text-transform:uppercase;letter-spacing:.08em;font-size:12px;font-weight:700;color:var(--accent)}
.sub{color:var(--muted);font-size:14px;max-width:80ch}
.num{font-variant-numeric:tabular-nums}
header{display:flex;flex-direction:column;gap:6px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.kpi .big{font-family:var(--f-display);font-stretch:85%;font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .big small{font-size:15px;font-weight:600;color:var(--muted)}
.kpi .cmp{font-size:13.5px;color:var(--muted)}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.p-merma{background:var(--merma-bg);color:var(--merma)} .p-quiebre{background:var(--quiebre-bg);color:var(--quiebre)} .p-ok{background:var(--ok-bg);color:var(--ok)} .p-neu{background:var(--soft);color:var(--muted)} .p-acc{background:var(--accent-soft);color:var(--accent)}
section{display:flex;flex-direction:column;gap:12px;min-width:0}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:18px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px;box-shadow:0 4px 14px rgb(0 0 0 / .12);white-space:nowrap;z-index:5}
.tip b{font-family:var(--f-display);font-stretch:85%}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-family:var(--f-display);font-stretch:85%;font-weight:700;font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;position:sticky;top:0;background:var(--panel);z-index:1;vertical-align:bottom}
th.sort{cursor:pointer;user-select:none} th.sort:hover{color:var(--ink)} th.on{color:var(--accent)}
th.l,td.l{text-align:left}
td{font-variant-numeric:tabular-nums}
td.prod{white-space:normal;min-width:220px;max-width:320px}
td.prod .code{color:var(--muted);font-size:12px;display:block}
tbody tr.row{cursor:pointer} tbody tr.row:hover{background:var(--soft)} tbody tr.row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
tbody tr.open{background:var(--soft)}
tr.tot td{font-weight:700;border-top:2px solid var(--line)}
.grp th{background:var(--soft);text-align:center;border-bottom:none;padding-bottom:2px}
.tight{max-height:70vh;overflow:auto}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=search],select{font:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);min-width:0}
input[type=search]{width:240px;max-width:100%}
.chip{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:99px;padding:5px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.chip .n{font-variant-numeric:tabular-nums;opacity:.8;margin-left:4px}
button.btn{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.flags{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-start}
.promo{font-size:12px;color:var(--muted);white-space:normal;max-width:220px;text-align:left}
.promo b{color:var(--ink);font-weight:600}
.detail td{padding:14px;background:var(--soft);white-space:normal;text-align:left}
.dgrid{position:sticky;left:14px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px}
@media (max-width:900px){.dgrid{grid-template-columns:1fr}}
.dgrid h3{font-size:15px;margin-bottom:6px}
.note{font-size:13px;color:var(--muted)}
.method{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px 28px;font-size:14px}
.method h3{font-size:15px;margin-bottom:4px}
.method p{margin:0 0 6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:10}
.neg{color:var(--quiebre)} .pos{color:var(--merma)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">Mes +1 · Lácteos y Jugos</div>
    <h1 id="titulo">Forecast</h1>
    <div class="sub" id="subt"></div>
  </header>

  <div class="kpis" id="kpis"></div>

  <section id="sec-foco">
    <div class="sec-head">
      <h2>Foco por SKU y gerencia: FCST vs su SOP y propuesta</h2>
      <span class="note" id="nota-foco-top"></span>
    </div>
    <div class="sec-head">
      <div class="ctrls" id="chips-f"></div>
      <div class="ctrls"><input type="search" id="q-f" placeholder="Buscar SKU o producto" aria-label="Buscar en foco por SKU"><select id="ger-f" aria-label="Gerencia"></select><select id="sc-f" aria-label="Subcategoría"></select><button class="btn" id="copiar-f" type="button">Copiar para Excel</button></div>
    </div>
    <div class="card tight"><table id="t-foco"></table></div>
    <div class="note" id="nota-foco"></div>
  </section>

  <section id="sec-puente">
    <div class="sec-head">
      <h2>Puente SOP → FCST</h2>
      <span class="note" id="nota-puente-top"></span>
    </div>
    <div class="card chart" id="chart-puente"></div>
    <div class="sec-head">
      <div class="ctrls" id="chips-p"></div>
      <div class="ctrls"><input type="search" id="q-p" placeholder="Buscar SKU o producto" aria-label="Buscar en el puente"><button class="btn" id="copiar-p" type="button">Copiar puente para Excel</button></div>
    </div>
    <div class="card tight"><table id="t-puente"></table></div>
    <div class="note" id="nota-puente"></div>
  </section>

  <section id="sec-curva">
    <div class="sec-head">
      <h2>Sell In semanal supermercados vs forecast</h2>
      <div class="legend" id="leg-total"></div>
    </div>
    <div class="card chart" id="chart-total"></div>
    <div class="note" id="nota-curva"></div>
  </section>

  <section id="sec-cadenas">
    <div class="sec-head"><h2>Por cadena</h2><span class="note">Toneladas del mes. Haz clic en una cadena para filtrar los SKU.</span></div>
    <div class="card scroll"><table id="t-cad"></table></div>
  </section>

  <section id="sec-sku">
    <div class="sec-head">
      <h2>Por SKU</h2>
      <div class="ctrls">
        <input type="search" id="q" placeholder="Buscar SKU o producto" aria-label="Buscar SKU o producto">
        <select id="f-subcat" aria-label="Subcategoría"></select>
        <select id="f-cad" aria-label="Cadena"></select>
        <button class="btn" id="copiar" type="button">Copiar tabla para Excel</button>
      </div>
    </div>
    <div class="ctrls" id="chips"></div>
    <div class="card tight"><table id="t-sku"></table></div>
    <div class="note" id="nota-sku"></div>
  </section>

  <section id="sec-metodo">
    <h2>Cómo se calcula</h2>
    <div class="card method" id="metodo"></div>
  </section>
</div>
<div class="tip" id="tip" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
const D=/*__DATOS__*/null;
const MES=D.mes_nombre, MESC=MES[0].toUpperCase()+MES.slice(1), A0=D.anio-1, A1=D.anio;
const PRECIO={posCls:'p-quiebre',negCls:'p-ok'};   // como tu Leyenda: rojo = precio subió, verde = bajó
const MESES_L=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const U={sop:0.15, ref:0.25, minT:3, sesgo:0.30, precio:0.05};   // umbrales de alerta
const $=s=>document.querySelector(s);
const fT=v=>v==null||isNaN(v)?'—':(Math.abs(v)>=100?Math.round(v).toLocaleString('es-CL'):v.toLocaleString('es-CL',{maximumFractionDigits:1,minimumFractionDigits:Math.abs(v)<10&&v!==0?1:0}));
const fP=(v,s=true)=>v==null||!isFinite(v)?'—':(s&&v>0?'+':'')+(v*100).toLocaleString('es-CL',{maximumFractionDigits:0})+'%';
const fX=v=>v==null?'—':v.toLocaleString('es-CL',{maximumFractionDigits:2,minimumFractionDigits:2})+'×';
const fCLP=v=>v==null?'—':'$'+Math.round(v).toLocaleString('es-CL');
const dlt=(a,b)=>b>0?a/b-1:null;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function pillDelta(d,abs,thr,{posCls='p-merma',negCls='p-quiebre'}={}){
  if(d==null||!isFinite(d))return '<span class="pill p-neu">—</span>';
  const cls=Math.abs(d)>=thr&&abs>=U.minT?(d>0?posCls:negCls):'p-neu';
  return `<span class="pill ${cls}">${fP(d)}</span>`;
}

/* ---------- encabezado ---------- */
$('#titulo').textContent=`Forecast ${MESC} ${A1}`;
const pesos=Object.entries(D.pesos_act).map(([w,p])=>p<0.999?`S${w} × ${Math.round(p*6)}/6`:`S${w}`).join(' + ');
$('#subt').innerHTML=`Archivo <b>${esc(D.archivo)}</b> · generado ${D.generado}. ${MESC} ${A1} = ${pesos}`+
  (D.proxy_semanas.length?`; la S${D.proxy_semanas.join(', S')} no está en el forecast y se usa la S${D.ult_fcst}`:'')+
  `. Historia de Sell In y precios ${A0}–${A1} solo para supermercados (hay ${A1} real hasta la S${D.ult_real}).`;

/* ---------- KPIs ---------- */
const S=D.skus, T=D.total;
const tot=k=>S.reduce((a,s)=>a+(s[k]||0),0);
const fcstTot=tot('fcst'), sopTot=tot('sop'), fcstRet=tot('fcst_ret'), refRet=tot('ref');
const kpi=(lbl,big,unit,cmp)=>`<div class="kpi"><div class="lbl">${lbl}</div><div class="big">${big} <small>${unit}</small></div><div class="cmp">${cmp}</div></div>`;
$('#kpis').innerHTML=
  kpi(`FCST ${MES} · todos los canales`,fT(fcstTot),'t',`SOP ${D.mes_abrev} ${fT(sopTot)} t ${pillDelta(dlt(fcstTot,sopTot),99,0.05)}`)+
  kpi(`FCST ${MES} · supermercados`,fT(fcstRet),'t',`Referencia histórica ${fT(refRet)} t ${pillDelta(dlt(fcstRet,refRet),99,0.1)}`)+
  kpi(`Sell In ${MES} ${A0} · supermercados`,fT(T.si_mes_ant),'t',`Ritmo ${A1} vs ${A0} (S${D.sem_yoy[0]}–S${D.sem_yoy[1]}): <b>${fP(T.yoy-1)}</b>`)+
  kpi(`Sesgo del FCST S${D.sem_overlap[0]}–S${D.sem_overlap[1]}`,fP(T.sesgo),'',`FCST ${fT(T.ov_fcst)} t vs Sell In real ${fT(T.ov_real)} t`)+
  kpi(`Precio actual vs ${MES} ${A0}`,fP(T.dp_real),'real',`Nominal ${fP(T.dp_nom)} · ${fCLP(T.p_act)} vs ${fCLP(T.p_ant)} por caja`);

/* ---------- gráfico semanal ---------- */
const tip=$('#tip');
function lineChart(el,series,{h=260,band=null,fmt=fT,yLabel='t'}={}){
  const W=Math.max(el.clientWidth-28,280), H=h, m={l:46,r:12,t:12,b:26};
  const xs=[...new Set(series.flatMap(s=>s.pts.map(p=>p[0])))].sort((a,b)=>a-b);
  if(!xs.length){el.innerHTML='<div class="note">Sin datos de historia para este SKU.</div>';return;}
  const x0=xs[0],x1=xs[xs.length-1];
  const vals=series.flatMap(s=>s.pts.map(p=>p[1])).filter(v=>v!=null);
  let lo=Math.min(0,...vals), hi=Math.max(...vals)*1.08||1;
  if(series.yFree){lo=Math.min(...vals)*0.95;}
  const X=w=>m.l+(x1===x0?0:(w-x0)/(x1-x0))*(W-m.l-m.r), Y=v=>H-m.b-(v-lo)/(hi-lo||1)*(H-m.t-m.b);
  const ticks=[];const step=niceStep((hi-lo)/4);for(let v=Math.ceil(lo/step)*step;v<=hi;v+=step)ticks.push(v);
  let g=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Serie semanal">`;
  if(band){g+=`<rect x="${X(band[0])-4}" y="${m.t}" width="${X(band[1])-X(band[0])+8}" height="${H-m.t-m.b}" fill="var(--accent-soft)"/>`+
    `<text x="${(X(band[0])+X(band[1]))/2}" y="${m.t+12}" text-anchor="middle" style="font-weight:700;fill:var(--accent)">${MES}</text>`;}
  ticks.forEach(v=>{g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${m.l-6}" y="${Y(v)+4}" text-anchor="end">${fmt(v)}</text>`;});
  const every=Math.ceil(xs.length/((W-m.l)/34));
  xs.forEach((w,i)=>{if(i%every===0)g+=`<text x="${X(w)}" y="${H-8}" text-anchor="middle">S${w}</text>`;});
  series.forEach(s=>{
    const segs=[];let cur=[];s.pts.forEach(p=>{if(p[1]==null){if(cur.length)segs.push(cur);cur=[];}else cur.push(p);});if(cur.length)segs.push(cur);
    segs.forEach(sg=>{g+=`<polyline fill="none" stroke="${s.color}" stroke-width="${s.w||2}" ${s.dash?`stroke-dasharray="${s.dash}"`:''} stroke-linejoin="round" points="${sg.map(p=>X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join(' ')}"/>`;});
    const last=s.pts.filter(p=>p[1]!=null).pop();if(last)g+=`<circle cx="${X(last[0])}" cy="${Y(last[1])}" r="3" fill="${s.color}"/>`;
  });
  g+=`<line id="hl" x1="0" x2="0" y1="${m.t}" y2="${H-m.b}" stroke="var(--muted)" stroke-dasharray="2 3" visibility="hidden"/>`;
  g+=`<rect x="${m.l}" y="${m.t}" width="${W-m.l-m.r}" height="${H-m.t-m.b}" fill="transparent" class="hit"/></svg>`;
  el.innerHTML=g;
  const svg=el.querySelector('svg'),hl=svg.querySelector('#hl');
  svg.querySelector('.hit').addEventListener('pointermove',e=>{
    const r=svg.getBoundingClientRect(),sx=(e.clientX-r.left)*W/r.width;
    const w=xs.reduce((a,b)=>Math.abs(X(b)-sx)<Math.abs(X(a)-sx)?b:a);
    hl.setAttribute('x1',X(w));hl.setAttribute('x2',X(w));hl.setAttribute('visibility','visible');
    tip.innerHTML=`<b>Semana ${w}</b><br>`+series.map(s=>{const p=s.pts.find(p=>p[0]===w);return p&&p[1]!=null?`<span style="color:${s.color}">●</span> ${s.name}: <b>${fmt(p[1])}</b> ${yLabel}`:''}).filter(Boolean).join('<br>');
    tip.hidden=false;
    const er=el.getBoundingClientRect(),wr=document.body.getBoundingClientRect();
    let left=e.clientX-wr.left+14;if(left+tip.offsetWidth>document.documentElement.clientWidth-8)left=e.clientX-wr.left-tip.offsetWidth-14;
    tip.style.left=Math.max(8,left)+'px';tip.style.top=(e.clientY-wr.top+14)+'px';
  });
  svg.querySelector('.hit').addEventListener('pointerleave',()=>{tip.hidden=true;hl.setAttribute('visibility','hidden');});
}
function niceStep(r){const p=Math.pow(10,Math.floor(Math.log10(r||1)));const n=r/p;return (n<1.5?1:n<3?2:n<7?5:10)*p;}
const css=v=>`var(${v})`;
function serieTotal(){
  const ws=Object.keys(D.total_sem).map(Number);
  const xsAll=ws.filter(w=>w>=D.sem_yoy[0]);
  return [
    {name:`Sell In ${A0}`,color:css('--y25'),pts:xsAll.map(w=>[w,D.total_sem[w].si0])},
    {name:`Sell In ${A1}`,color:css('--accent'),w:2.5,pts:xsAll.filter(w=>w<=D.ult_real).map(w=>[w,D.total_sem[w].si1])},
    {name:`FCST ${A1} (supermercados)`,color:css('--merma'),dash:'5 4',pts:Object.entries(D.total_sem_fcst).map(([w,v])=>[+w,v])},
  ];
}
const nov=Object.keys(D.pesos_act).map(Number).filter(w=>D.pesos_act[w]>0.5);
function legend(el,series){el.innerHTML=series.map(s=>`<span><i style="background:${s.color}"></i>${s.name}</span>`).join('');}
function drawTotal(){const s=serieTotal();legend($('#leg-total'),s);lineChart($('#chart-total'),s,{band:[Math.min(...nov),Math.max(...nov)]});}
$('#nota-curva').textContent=`Solo cadenas de supermercados con historia (Walmart, Cencosud, Unimarc, Tottus, Alvi y Supermercados Región). La banda marca ${MES}. Canal Tradicional, CCU e Industrial no están en el archivo de precios (Canal Tradicional se compara contra su venta real en la tabla por cadena).`;

/* ---------- flags ---------- */
function flagsDe(r,conSop){
  const f=[];
  if(conSop&&r.sop>0){const d=dlt(r.fcst,r.sop);if(Math.abs(d)>=U.sop&&Math.abs(r.fcst-r.sop)>=U.minT)f.push({k:'sop',t:d>0?'Sobre SOP':'Bajo SOP',c:d>0?'p-merma':'p-quiebre'});}
  const fr=r.fcst_ret??r.fcst;
  if(r.ref!=null){const d=dlt(fr,r.ref);if(d!=null&&Math.abs(d)>=U.ref&&Math.abs(fr-r.ref)>=U.minT)f.push({k:'hist',t:d>0?'Sobre historia':'Bajo historia',c:d>0?'p-merma':'p-quiebre',dir:d>0?1:-1});}
  if(r.sesgo!=null&&Math.abs(r.sesgo)>=U.sesgo&&Math.abs(r.ov_fcst-r.ov_real)>=U.minT)f.push({k:'sesgo',t:r.sesgo>0?'Venía alto':'Venía bajo',c:r.sesgo>0?'p-merma':'p-quiebre'});
  const base=r.base||r;
  (r.promos||[]).filter(p=>p.vigente&&p.vol).forEach(p=>{const c=(base.cadenas||[]).find(c=>c.subcadena===p.cadena);
    if(c&&p.vol-c.fcst>=1&&!f.some(x=>x.k==='pactado'))f.push({k:'pactado',t:'Pactado > FCST',c:'p-quiebre'});});
  if(r.dp_real!=null&&r.dp_real>=U.precio&&r.ref!=null&&fr>r.ref)f.push({k:'precio',t:'Precio arriba',c:'p-merma'});
  if(r.dp_real!=null&&r.dp_real<=-U.precio&&r.ref!=null&&fr<r.ref)f.push({k:'precio',t:'Precio abajo',c:'p-quiebre'});
  return f;
}

function filas(){

  return S.filter(s=>(!sc||s.subcat===sc)&&(!q||String(s.sku).includes(q)||s.producto.toLowerCase().includes(q))).map(s=>{

      r={...c,sku:s.sku,producto:s.producto,subcat:s.subcat,fcst_ret:c.retail?c.fcst:null,sop:null,
        promos:s.promos.filter(p=>p.cadena===filtroCad),uplift:upliftDe(c.sem_fcst),base:s};}
    else r={...s,base:s};
    r.flags=flagsDe(r,!filtroCad);
    r.dref=r.ref!=null?dlt(r.fcst_ret??r.fcst,r.ref):null; r.dsop=r.sop?dlt(r.fcst,r.sop):null;

function upliftDe(sem){const ws=Object.keys(D.pesos_act).map(Number);const w0=Math.min(...ws);const prev=D.semanas_fcst.filter(w=>w<w0&&w>=w0-4);
  const pp=prev.reduce((a,w)=>a+(sem[w]||0),0)/(prev.length||1);const nm=ws.reduce((a,w)=>a+D.pesos_act[w]*(sem[w]??sem[D.ult_fcst]??0),0)/D.sem_mes;return pp>0?nm/pp-1:null;}
function pasaChip(r){
  if(chip==='todos')return true;
  if(chip==='alerta')return r.flags.length>0;

  return r.flags.some(f=>f.k===chip);
}

function isoSemana(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const dn=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-dn);const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y0)/864e5+1)/7);}

function efectoPromo(p,c){
  // devuelve {inc, tipo, txt}: toneladas incrementales sobre la base histórica de esa cadena
  const ref=conHist(c)?c.ref:null;
  if(p.vol>0){
    if(ref==null)return {inc:0,tipo:'sinbase',txt:`${p.cadena}: ${fT(p.vol)} t pactadas, sin historia para medir el incremental`};
    const inc=Math.max(0,p.vol-ref);
    return {inc,tipo:'vol',txt:`${p.cadena}: ${fT(p.vol)} t pactadas vs base ${fT(ref)} t → ${inc>0?'+'+fT(inc)+' t':'sin incremental'}`};
  }

    const w0=inicioPromo(p);if(w0==null)return {inc:0,tipo:'base',txt:`${p.cadena}: ${p.nombre}, sin fecha de inicio`};
    const bw=ref/D.sem_mes;let inc=0;

  const rs=base.filter(r=>pasa(r,chipF)).map(r=>({...r,agap:Math.abs(r.gap),dprev:r.prev?r.fcst-r.prev.fcst:null}));
  const k=ordF.k;rs.sort((a,b)=>{const va=a[k],vb=b[k];return typeof va==='string'?ordF.dir*va.localeCompare(vb):ordF.dir*((va??-1e9)-(vb??-1e9));});
  const pd=(d,abs,thr=UF.pct)=>d==null||!isFinite(d)?'<span class="pill p-neu">—</span>':`<span class="pill ${Math.abs(d)>=thr&&Math.abs(abs)>=UF.t?(d>0?'p-merma':'p-quiebre'):'p-neu'}">${d>0?'▲ ':d<0?'▼ ':''}${fP(d)}</span>`;
  const cf={alta:'<span class="pill p-ok">Alta</span>',media:'<span class="pill p-neu">Media</span>',baja:'<span class="pill p-quiebre" style="opacity:.85">Baja</span>',sh:'<span class="pill p-neu">Sin historia</span>'};
  const C=[['producto','Producto',1],['gerencia','Gerencia',1],['sop',`SOP ${D.mes_abrev}`],['fcst',`Tu FCST ${MES}`],['dgap','Δ% tu FCST vs SOP'],['prop','FCST propuesto'],['dprop','Δ% propuesto vs SOP'],...(D.anterior?[['dprev','Cambio vs FCST anterior']]:[]),['dpf','Propuesto − tu FCST'],['conf','Confianza',1],['why','Por qué',1,1]];
  let h='<thead><tr>'+C.map(([k,t,l,ns])=>`<th class="${l?'l ':''}${ns?'':'sort'}${ordF.k===k?' on':''}" ${ns?'':`data-k="${k}"`}>${t}${ordF.k===k?(ordF.dir>0?' ▲':' ▼'):''}</th>`).join('')+'</tr></thead><tbody>';
  const sm={sop:0,fcst:0,prop:0};
  rs.forEach(r=>{sm.sop+=r.sop;sm.fcst+=r.fcst;sm.prop+=r.prop;
    h+=`<tr class="row" tabindex="0" data-sku="${r.sku}"><td class="l prod"><b>${esc(r.producto)}</b><span class="code">${r.sku} · ${esc(r.subcat)}</span></td><td class="l"><span class="pill ${r.gerencia==='NACIONAL'?'p-neu':'p-acc'}">${esc(r.gerencia)}</span></td><td>${fT(r.sop)}</td><td><b>${fT(r.fcst)}</b></td><td>${pd(r.dgap,r.gap)}</td><td><b>${fT(r.prop)}</b></td><td>${pd(r.dprop,r.prop-r.sop)}</td>${D.anterior?`<td>${r.prev?`${r.fcst-r.prev.fcst>0.05?'+':''}${fT(r.fcst-r.prev.fcst)} <span class="note">${fP(dlt(r.fcst,r.prev.fcst))}</span>${Math.abs(r.sop-r.prev.sop)>0.05?`<br><span class="note">SOP ${fT(r.prev.sop)} → ${fT(r.sop)}</span>`:''}`:'—'}</td>`:''}<td>${r.dpf>0.05?'+':''}${fT(r.dpf)} <span class="note">${fP(r.dpfp)}</span></td><td class="l">${cf[r.conf]}</td><td class="promo" style="max-width:440px;min-width:300px">${esc(porQue(r))}</td></tr>`;});
  h+=`<tr class="tot"><td class="l">${rs.length} filas</td><td></td><td>${fT(sm.sop)}</td><td>${fT(sm.fcst)}</td><td>${fP(dlt(sm.fcst,sm.sop))}</td><td>${fT(sm.prop)}</td><td>${fP(dlt(sm.prop,sm.sop))}</td>${D.anterior?`<td>${(()=>{const pv=rs.reduce((x,r)=>x+(r.prev?r.prev.fcst:0),0);return (sm.fcst-pv>0?'+':'')+fT(sm.fcst-pv);})()}</td>`:''}<td>${sm.prop-sm.fcst>0?'+':''}${fT(sm.prop-sm.fcst)}</td><td></td><td></td></tr></tbody>`;
  $('#t-foco').innerHTML=h;window._rf=rs;
  const all=FOCO, tS=all.reduce((a,r)=>a+r.sop,0), tF=all.reduce((a,r)=>a+r.fcst,0), tP=all.reduce((a,r)=>a+r.prop,0);
  const pg=GERS.map(g=>{const x=all.filter(r=>r.gerencia===g);const so=x.reduce((a,r)=>a+r.sop,0),fc=x.reduce((a,r)=>a+r.fcst,0);return `${g} ${fT(fc)}/${fT(so)} t (${fP(dlt(fc,so))})`;}).join(' · ');
  $('#nota-foco-top').textContent=`${all.filter(r=>desv(r.dgap,r.gap)).length} de ${all.length} SKU×gerencia desviados vs su SOP · FCST/SOP por gerencia: ${pg} · SOP ${fT(tS)} t · tu FCST ${fT(tF)} t (${fP(dlt(tF,tS))}) · propuesto ${fT(tP)} t (${fP(dlt(tP,tS))})`;
  const avisos=[];
  if(D.sop_igual&&D.sop_igual.length)avisos.push('SOP de una gerencia idéntico al de NACIONAL (se suma, pero revisa que no sea arrastre): '+D.sop_igual.map(x=>`${x.sku} ${esc(x.producto)} ${x.gerencia} ${fT(x.sop)} t con FCST ${fT(x.fcst)} t`).join('; '));
  if(D.sop_dup&&D.sop_dup.length)avisos.push('SOP que repite el de NACIONAL y no se suma: '+D.sop_dup.map(x=>`${x.sku} ${x.gerencia} (${fT(x.sop)} t, FCST ${fT(x.fcst)} t)`).join('; '));
  if(D.sop_raro&&D.sop_raro.length)avisos.push('SOP distinto dentro de una misma gerencia (se usa el más frecuente): '+D.sop_raro.map(x=>`${x.sku} ${esc(x.producto)} · ${x.cadena} ${fT(x.valor)} t vs ${fT(x.usado)} t`).join('; '));
  $('#nota-foco').innerHTML=(avisos.length?`<b>Revisa en tu archivo:</b> ${avisos.join(' · ')}.<br>`:'')+(D.anterior?`<b>Cambio vs FCST anterior</b> compara con ${esc(D.anterior.archivo)} usando la misma fórmula del mes. `:'')+`Cada fila es un SKU dentro de una gerencia (NACIONAL, JUNAEB, INDUSTRIAL, ECUSA/CCU) y se compara con el SOP de esa gerencia. <b>Desviado</b> = |Δ| de al menos ${fP(UF.pct,false)} y ${UF.t} t. <b>FCST propuesto</b> = historia de cada cadena de supermercados (Sell In ${MES} ${A0} ajustado por el ritmo ${A1}, y ritmo reciente ajustado por estacionalidad) + el volumen de promos sobre esa base + la venta real S${D.venta_real_sem?D.venta_real_sem.join('–S'):'—'} de Canal Tradicional + tu FCST en los canales sin historia (CCU, Industrial y cadenas donde el SKU no vendía antes). El precio ya está dentro de la base (usa la venta 2026 a precios actuales); el efecto precio del puente dice cuánto de la diferencia con el SOP se debe al precio. <b>Confianza</b>: alta si al menos 70% del volumen tiene historia y los dos métodos coinciden en ±20% (baja a media si más del 40% viene de la venta real de Canal Tradicional, que solo tiene 6 semanas y no tiene estacionalidad); baja si menos de 40% tiene historia, la historia es menor a 5 t o los métodos difieren más de 50%. Haz clic en un SKU para ver su detalle por cadena.`;
}
$('#chips-f').addEventListener('click',e=>{const b=e.target.closest('[data-chip]');if(b){chipF=b.dataset.chip;drawFoco();}});
$('#q-f').addEventListener('input',e=>{qF=e.target.value.trim().toLowerCase();drawFoco();});
$('#sc-f').addEventListener('input',e=>{scF=e.target.value;drawFoco();});
$('#ger-f').innerHTML='<option value="">Todas las gerencias</option>'+GERS.map(x=>`<option>${esc(x)}</option>`).join('');
$('#ger-f').addEventListener('input',e=>{gerF=e.target.value;drawFoco();});
$('#t-foco').addEventListener('click',e=>{const th=e.target.closest('th[data-k]');if(th){const k=th.dataset.k;ordF=ordF.k===k?{k,dir:-ordF.dir}:{k,dir:['producto','conf','gerencia'].includes(k)?1:-1};drawFoco();return;}
  const tr=e.target.closest('tr[data-sku]');if(tr)irSku(+tr.dataset.sku);});
$('#t-foco').addEventListener('keydown',e=>{if(e.key==='Enter'){const tr=e.target.closest('tr[data-sku]');if(tr)irSku(+tr.dataset.sku);}});
$('#copiar-f').addEventListener('click',()=>{
  const num=v=>v==null||!isFinite(v)?'':String(Math.round(v*1000)/1000).replace('.',',');
  const lines=[['SKU','Producto','Subcategoría','Gerencia',`SOP ${D.mes_abrev}`,`Tu FCST ${MES}`,'Δ% tu FCST vs SOP','FCST propuesto','Δ% propuesto vs SOP','Propuesto − tu FCST (t)','Cambio vs FCST anterior (t)','Confianza','Por qué'].join('\t'),
    ...window._rf.map(r=>[r.sku,r.producto,r.subcat,r.gerencia,num(r.sop),num(r.fcst),num(r.dgap),num(r.prop),num(r.dprop),num(r.dpf),num(r.dprev),r.conf==='sh'?'sin historia':r.conf,porQue(r).replace(/\t|\n/g,' ')].join('\t'))];
  const txt=lines.join('\n');const ok=()=>toast(`Copiadas ${window._rf.length} filas.`);
  try{navigator.clipboard.writeText(txt).then(ok,()=>fallback(txt));}catch(e){fallback(txt);}
});

drawFoco();drawPuente();drawCad();drawSku();drawTotal();
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{drawTotal();drawPuente();if(abierto!=null){const r=window._rs.find(r=>r.sku===abierto);if(r)drawDetalle(r.base);}},150);});
</script>
